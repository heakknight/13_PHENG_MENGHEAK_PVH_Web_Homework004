<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Task | To do List</title>
  <link rel="stylesheet" href="./styles/output.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-blue-200">
  <main class="mx-70 my-20">
    <div class="flex justify-between p-5">
      <span class="text-3xl font-black">Task List</span>
      <button class="bg-purple-600 font-bold p-3 pl-5 pr-5 rounded-2xl cursor-pointer text-white" id="addTask">
        Add Task
      </button>
    </div>
    <div class="bg-white rounded-2xl flex justify-between p-5 pl-10 pr-15 mb-10">
      <span class="inline-block w-1/5 text-cyan-500 font-black text-[20px]">Task</span>
      <span class="text-cyan-500 font-black text-[20px]">Priority</span>
      <span class="text-cyan-500 font-black text-[20px]">Status</span>
      <span class="text-amber-400 font-black text-[20px]">Action</span>
    </div>

    <dialog id="formDialog" class="rounded-3xl p-8 w-full max-w-md shadow-2xl backdrop:bg-gray-800/40
      m-150 mt-50">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Add Task</h2>
        <button id="closeDialog" class="text-2xl text-gray-500 cursor-pointer">x</button>
      </div>
      <form id="taskForm">
        <div class="flex flex-col gap-2">
          <label class="font-bold text-sm">Task</label>
          <input type="text" id="taskInput" required class="w-full px-4 py-3 border-2 border-cyan-400 rounded-2xl" />
        </div>
        <div class="flex flex-col gap-2">
          <label class="font-bold text-sm">Priority</label>
          <div class="flex gap-3" id="priority">
            <label class="cursor-pointer">
              <input type="radio" name="priority" value="High" class="hidden peer" />
              <span class="px-4 py-1.5 rounded-xl border-2 border-red-500 text-red-500  
                 peer-checked:bg-red-500 peer-checked:text-white block">High</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="priority" value="Medium" class="hidden peer" />
              <span class="px-4 py-1.5 rounded-xl border-2 border-amber-400 text-amber-400 peer-checked:bg-amber-400
                 peer-checked:text-white block">Medium</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="priority" value="Low" class="hidden peer" />
              <span class="px-4 py-1.5 rounded-xl border-2 border-green-500 text-green-500  peer-checked:bg-green-500
                 peer-checked:text-white block">Low</span>
            </label>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <label class="font-bold">Status</label>
          <div class="flex gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="status" value="To Do" class="hidden peer" />
              <span class="px-4 py-1.5 rounded-xl border-2 border-cyan-400 text-cyan-500
                  peer-checked:bg-cyan-400 peer-checked:text-white block text-xs">To Do</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="Progress" class="hidden peer" />
              <span class="px-4 py-1.5 rounded-xl border-2 border-cyan-400 text-cyan-500 
                peer-checked:bg-cyan-400 peer-checked:text-white block text-xs">Progress</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="Done" class="hidden peer" />
              <span
                class="px-4 py-1.5 rounded-xl border-2 border-cyan-400 text-cyan-500  peer-checked:bg-cyan-400 peer-checked:text-white block text-xs">Done</span>
            </label>
          </div>
        </div>

        <div class="flex justify-end pt-4 gap-3">
          <button type="button" id="cancelTask"
            class="px-8 py-3 bg-blue-500 text-white font-bold rounded-2xl cursor-pointer">
            Cancel
          </button>

          <button type="submit" id="submitTask"
            class="px-10 py-3 bg-purple-700 text-white font-bold rounded-2xl">
            Add
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="rounded-3xl w-full max-w-md p-8 shadow-2xl backdrop:bg-gray-800/40
      m-150 mt-50">
      <h2 class="text-3xl font-bold mb-6 text-center">Wanna delete?</h2>
      <div class="flex justify-center mb-6">
        <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500"></i>
      </div>
      <div class="flex justify-center gap-4">
        <button id="confirmYes" class="bg-red-500 text-white px-4 py-2 rounded-lg cursor-pointer">Yes
        </button>
        <button id="confirmNo" class="bg-blue-600 text-white px-4 py-2 rounded-lg cursor-pointer">No
        </button>
      </div>
    </dialog>
    <div id="container"></div>
  </main>
  <script src="./index.js"></script>
</body>

</html>
